<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="John Ray Cacananta, synthetic systems online" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE6A8"/>
      <stop offset="35%" stop-color="#E8B04A"/>
      <stop offset="100%" stop-color="#B3203A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0B14"/>
      <stop offset="100%" stop-color="#07131A"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3FB8AF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3FB8AF" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#3FB8AF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#3FB8AF" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:"JetBrains Mono","Fira Code",Consolas,monospace}
      .spin{transform-origin:220px 170px;animation:spin 18s linear infinite}
      .spinr{transform-origin:220px 170px;animation:spin 11s linear infinite reverse}
      .pulse{transform-origin:220px 170px;animation:pulse 3.2s ease-in-out infinite}
      .frag{opacity:0;animation:assemble 1.4s cubic-bezier(.2,.8,.2,1) forwards}
      .scanline{animation:scan 4.5s ease-in-out infinite}
      .line{opacity:0;animation:appear .01s forwards}
      .name{opacity:0;animation:rise 1s 2.6s cubic-bezier(.2,.8,.2,1) forwards}
      .role{opacity:0;animation:rise 1s 3.1s cubic-bezier(.2,.8,.2,1) forwards}
      .caret{animation:blink 1s steps(1) infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.08);opacity:1}}
      @keyframes assemble{from{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}to{opacity:1;transform:none}}
      @keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(360px)}}
      @keyframes appear{to{opacity:1}}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
    </style>
  </defs>

  <rect width="1000" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="18" fill="url(#grid)"/>
  <rect class="scanline" x="0" y="0" width="1000" height="70" fill="url(#scan)"/>

  <!-- neural core: fragments assemble, then rings orbit -->
  <g filter="url(#glow)">
    <g class="spin">
      <circle cx="220" cy="170" r="118" fill="none" stroke="#3FB8AF" stroke-opacity=".5" stroke-dasharray="2 10"/>
      <circle cx="220" cy="170" r="104" fill="none" stroke="#B3203A" stroke-width="2" stroke-dasharray="60 24 8 24"/>
    </g>
    <g class="spinr">
      <circle cx="220" cy="170" r="86" fill="none" stroke="#E8B04A" stroke-opacity=".7" stroke-dasharray="120 40"/>
      <circle cx="306" cy="170" r="4" fill="#E8B04A"/>
    </g>
    <g fill="none" stroke="#EDE6DA" stroke-opacity=".85" stroke-width="1.4">
      <path class="frag" style="--dx:-60px;--dy:-40px;--r:-30deg;animation-delay:.1s" d="M220 110 L262 134 L220 158 L178 134 Z"/>
      <path class="frag" style="--dx:70px;--dy:-30px;--r:25deg;animation-delay:.35s" d="M262 134 L262 182 L220 206 L220 158 Z"/>
      <path class="frag" style="--dx:-70px;--dy:40px;--r:20deg;animation-delay:.6s" d="M178 134 L220 158 L220 206 L178 182 Z"/>
      <path class="frag" style="--dx:40px;--dy:70px;--r:-20deg;animation-delay:.85s" d="M178 182 L220 206 L262 182 L220 230 Z" stroke="#3FB8AF"/>
    </g>
    <circle class="pulse" cx="220" cy="170" r="30" fill="url(#core)"/>
  </g>

  <!-- boot log -->
  <g font-size="13" fill="#3FB8AF">
    <text class="line" x="400" y="72" style="animation-delay:.4s">&gt; initializing synthetic runtime ............ ok</text>
    <text class="line" x="400" y="94" style="animation-delay:1.0s">&gt; loading memory index: python · ts · sql ... ok</text>
    <text class="line" x="400" y="116" style="animation-delay:1.6s">&gt; policy engine (opa/rego) armed ............ ok</text>
    <text class="line" x="400" y="138" style="animation-delay:2.2s" fill="#E8B04A">&gt; consciousness: ONLINE</text>
  </g>

  <text class="name" x="400" y="200" font-size="40" font-weight="700" fill="#EDE6DA" letter-spacing="1">John Ray Cacananta</text>
  <text class="role" x="400" y="236" font-size="17" fill="#E8B04A">Full-stack · AI security · Cloud · Automation</text>
  <g class="role">
    <text x="400" y="276" font-size="13" fill="#EDE6DA" fill-opacity=".6">building agents that know what they're allowed to do</text>
    <rect class="caret" x="808" y="265" width="8" height="14" fill="#B3203A"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
