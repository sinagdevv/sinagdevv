<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#B3203A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E8B04A"/>
      <stop offset="1" stop-color="#3FB8AF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .dot{animation:travel 3.5s ease-in-out infinite alternate}
      @keyframes travel{from{transform:translateX(0)}to{transform:translateX(960px)}}
      @media (prefers-reduced-motion:reduce){.dot{animation:none}}
    </style>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#g)"/>
  <g class="dot"><circle cx="20" cy="12" r="5" fill="#E8B04A"/><circle cx="20" cy="12" r="10" fill="#E8B04A" fill-opacity=".2"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
